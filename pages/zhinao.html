<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>煤矿安全助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-blue': '#1e3a5f',
                        'deep-blue-light': '#2d5a87',
                        'safety-orange': '#f97316',
                        'bg-primary': '#f8fafc',
                        'text-primary': '#1e293b',
                        'text-secondary': '#475569',
                        'text-muted': '#94a3b8',
                    },
                    fontFamily: { 'sans': ['Noto Sans SC', 'PingFang SC', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Noto Sans SC', 'PingFang SC', -apple-system, sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 0; display: none; }
        
        /* 搜索建议动画 */
        .suggestion-item {
            transition: all 0.2s ease;
        }
        .suggestion-item:hover {
            background-color: #f1f5f9;
            transform: translateX(4px);
        }
        
        /* 渐变背景 */
        .gradient-bg {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        
        /* AI光晕 */
        .ai-glow {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="bg-bg-primary text-text-primary">
    <div class="min-h-screen flex flex-col">
        <!-- 顶部区域 -->
        <div class="gradient-bg pt-12 pb-8 px-6">
            <!-- Logo和标题 -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl ai-glow mb-4">
                    <i class="fa-solid fa-brain text-white text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-deep-blue mb-2">煤矿安全助手</h1>
                <p class="text-sm text-text-muted">煤矿安全规程知识库智能问答</p>
            </div>

            <!-- 入口按钮 -->
            <div class="max-w-md mx-auto">
                <button id="enter-btn" class="w-full ai-glow text-white text-lg font-medium py-4 px-6 rounded-2xl flex items-center justify-center space-x-3 hover:shadow-lg hover:scale-[1.02] transition-all duration-200">
                    <i class="fa-solid fa-comments text-xl"></i>
                    <span>开始智能问答</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
                <p class="text-center text-xs text-text-muted mt-3">点击进入AI助手，随时咨询煤矿安全问题</p>
            </div>
        </div>

        <!-- 搜索建议区域 -->
        <div class="flex-1 px-6 py-6 overflow-y-auto">
            <!-- 热门问题 -->
            <div class="max-w-2xl mx-auto">
                <h3 class="text-sm font-bold text-text-primary mb-4 flex items-center">
                    <i class="fa-solid fa-fire text-safety-orange mr-2"></i>热门问题
                </h3>
                <div class="grid grid-cols-1 gap-3">
                    <div class="suggestion-item flex items-center justify-between p-4 bg-white rounded-xl border border-slate-100 cursor-pointer" onclick="startSearch('煤矿安全规程对瓦斯管理有哪些规定？')">
                        <div class="flex items-center space-x-3">
                            <span class="w-6 h-6 rounded-full bg-safety-orange/10 text-safety-orange text-xs flex items-center justify-center font-bold">1</span>
                            <span class="text-sm text-text-secondary">煤矿安全规程对瓦斯管理有哪些规定？</span>
                        </div>
                        <span class="text-xs text-text-muted"><i class="fa-solid fa-arrow-trend-up mr-1"></i>热门</span>
                    </div>
                    <div class="suggestion-item flex items-center justify-between p-4 bg-white rounded-xl border border-slate-100 cursor-pointer" onclick="startSearch('井下作业人员安全培训要求是什么？')">
                        <div class="flex items-center space-x-3">
                            <span class="w-6 h-6 rounded-full bg-deep-blue/10 text-deep-blue text-xs flex items-center justify-center font-bold">2</span>
                            <span class="text-sm text-text-secondary">井下作业人员安全培训要求是什么？</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-text-muted text-xs"></i>
                    </div>
                    <div class="suggestion-item flex items-center justify-between p-4 bg-white rounded-xl border border-slate-100 cursor-pointer" onclick="startSearch('煤矿水害防治的主要措施有哪些？')">
                        <div class="flex items-center space-x-3">
                            <span class="w-6 h-6 rounded-full bg-deep-blue/10 text-deep-blue text-xs flex items-center justify-center font-bold">3</span>
                            <span class="text-sm text-text-secondary">煤矿水害防治的主要措施有哪些？</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-text-muted text-xs"></i>
                    </div>
                    <div class="suggestion-item flex items-center justify-between p-4 bg-white rounded-xl border border-slate-100 cursor-pointer" onclick="startSearch('煤矿通风系统安全检查要点')">
                        <div class="flex items-center space-x-3">
                            <span class="w-6 h-6 rounded-full bg-deep-blue/10 text-deep-blue text-xs flex items-center justify-center font-bold">4</span>
                            <span class="text-sm text-text-secondary">煤矿通风系统安全检查要点</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-text-muted text-xs"></i>
                    </div>
                    <div class="suggestion-item flex items-center justify-between p-4 bg-white rounded-xl border border-slate-100 cursor-pointer" onclick="startSearch('煤矿安全监控系统运行管理规定')">
                        <div class="flex items-center space-x-3">
                            <span class="w-6 h-6 rounded-full bg-deep-blue/10 text-deep-blue text-xs flex items-center justify-center font-bold">5</span>
                            <span class="text-sm text-text-secondary">煤矿安全监控系统运行管理规定</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-text-muted text-xs"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== Dify 入口配置 ==========
        const DIFY_URL = 'search-result.html';

        // ========== 入口按钮 ==========
        document.getElementById('enter-btn').addEventListener('click', function() {
            window.location.href = DIFY_URL;
        });

        // ========== 热门问题点击（直接进入助手）==========
        function startSearch(query) {
            // 直接跳转到 Dify 助手页面，带上问题参数
            window.location.href = DIFY_URL + '?q=' + encodeURIComponent(query);
        }
    </script>
</body>
</html>

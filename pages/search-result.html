<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>煤矿安全助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'deep-blue': '#1e3a5f',
                        'deep-blue-light': '#2d5a87',
                        'safety-orange': '#f97316',
                        'bg-primary': '#f8fafc',
                        'text-primary': '#1e293b',
                        'text-secondary': '#475569',
                        'text-muted': '#94a3b8',
                    },
                    fontFamily: {
                        'sans': ['Noto Sans SC', 'PingFang SC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Noto Sans SC', 'PingFang SC', -apple-system, sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 0; display: none; }
        /* 毛玻璃效果 */
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        /* AI光晕 */
        .ai-glow { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4), 0 0 40px rgba(139, 92, 246, 0.3); }
        /* 问题提示条 */
        .query-hint {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            z-index: 40;
            transition: transform 0.3s ease;
        }
        .query-hint.hidden-hint {
            transform: translateY(-100%);
        }
        /* iframe容器 */
        .iframe-container {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            bottom: 0;
            transition: top 0.3s ease;
        }
        .iframe-container.with-hint {
            top: 112px;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-bg-primary text-text-primary">
    <!-- 顶部导航栏（保留统一风格） -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-effect border-b border-slate-200/50" style="height: 56px;">
        <div class="flex items-center h-full px-4 space-x-3">
            <button onclick="history.back()" class="text-text-secondary hover:text-deep-blue transition-colors">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="flex-1 flex items-center space-x-2">
                <div class="w-7 h-7 rounded-lg ai-glow flex items-center justify-center">
                    <i class="fa-solid fa-brain text-white text-sm"></i>
                </div>
                <span class="text-sm font-medium text-deep-blue">煤矿安全助手</span>
            </div>
            <button class="action-btn w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition-colors" id="new-chat-btn" title="新对话">
                <i class="fa-solid fa-plus text-sm text-text-secondary"></i>
            </button>
        </div>
    </header>

    <!-- 问题提示条 -->
    <div class="query-hint glass-effect border-b border-slate-200/50 hidden" id="query-hint">
        <div class="flex items-center px-4 py-3 space-x-3">
            <div class="flex-1 flex items-center space-x-2 min-w-0">
                <span class="text-xs text-text-muted flex-shrink-0">待提问：</span>
                <p class="text-sm text-text-primary truncate" id="query-text"></p>
            </div>
            <button class="flex-shrink-0 px-3 py-1.5 bg-deep-blue text-white text-xs rounded-lg hover:bg-deep-blue-light transition-colors" id="copy-query-btn">
                <i class="fa-solid fa-copy mr-1"></i>复制
            </button>
            <button class="flex-shrink-0 w-7 h-7 flex items-center justify-center text-text-muted hover:text-text-primary" id="close-hint-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Dify 助手嵌入区域 -->
    <div class="iframe-container">
        <iframe 
            id="dify-chatbot"
            src=""
            allow="microphone">
        </iframe>
    </div>

    <script>
        // ========== Dify 嵌入配置 ==========
        const DIFY_CONFIG = {
            baseUrl: 'https://udify.app/chat/shTiWXqHhZuHqPKJ',
        };

        // ========== 初始化 ==========
        function initDifyChatbot() {
            const iframe = document.getElementById('dify-chatbot');
            const queryHint = document.getElementById('query-hint');
            const queryText = document.getElementById('query-text');
            const iframeContainer = iframe.parentElement;
            
            // 获取 URL 参数中的问题
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            
            // 加载 Dify
            iframe.src = DIFY_CONFIG.baseUrl;
            
            // 如果有问题，显示提示条
            if (query && query.trim()) {
                queryText.textContent = query;
                queryHint.classList.remove('hidden');
                iframeContainer.classList.add('with-hint');
            }
        }

        // ========== 复制问题 ==========
        document.getElementById('copy-query-btn').addEventListener('click', function() {
            const queryText = document.getElementById('query-text').textContent;
            navigator.clipboard.writeText(queryText).then(() => {
                this.innerHTML = '<i class="fa-solid fa-check mr-1"></i>已复制';
                setTimeout(() => {
                    this.innerHTML = '<i class="fa-solid fa-copy mr-1"></i>复制';
                }, 2000);
            });
        });

        // ========== 关闭提示条 ==========
        document.getElementById('close-hint-btn').addEventListener('click', function() {
            const queryHint = document.getElementById('query-hint');
            const iframeContainer = document.querySelector('.iframe-container');
            queryHint.classList.add('hidden-hint');
            setTimeout(() => {
                queryHint.classList.add('hidden');
            }, 300);
            iframeContainer.classList.remove('with-hint');
        });

        // ========== 新对话按钮 ==========
        document.getElementById('new-chat-btn').addEventListener('click', function() {
            const iframe = document.getElementById('dify-chatbot');
            // 重新加载 iframe 以开始新对话
            iframe.src = DIFY_CONFIG.baseUrl;
            // 隐藏问题提示条
            const queryHint = document.getElementById('query-hint');
            const iframeContainer = document.querySelector('.iframe-container');
            queryHint.classList.add('hidden');
            iframeContainer.classList.remove('with-hint');
        });

        // ========== 页面加载 ==========
        document.addEventListener('DOMContentLoaded', initDifyChatbot);
    </script>
</body>
</html>
